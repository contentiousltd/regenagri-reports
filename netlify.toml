# This host served the 2024 impact report before it moved to its own subdomain.
# It now serves the index page linking to each year, so "/" belongs to this
# site and must not be redirected -- but every deep path from the old report
# still 404s here, and those URLs are the ones in circulation.
#
# Netlify placeholders match a whole path segment, so ":slug.html" never
# matches and a bare "/stories/:slug" would rewrite to the literal string.
# Every rule below is therefore spelled out explicitly.
[build]
  publish = "."

[[redirects]]
  from = "/stories/aritzia.html"
  to = "https://2024.regenagri.org/stories/aritzia/"
  status = 301
  force = true

[[redirects]]
  from = "/stories/aritzia"
  to = "https://2024.regenagri.org/stories/aritzia/"
  status = 301
  force = true

